name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  docker-smoke-test:
    name: Docker Hermetic Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Test Suite & Smoke Test via Docker Compose
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: knowledge_fabric
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: knowledge_fabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      KF_DB_HOST: localhost
      KF_DB_PORT: 5432
      KF_DB_NAME: knowledge_fabric_test
      KF_DB_USER: knowledge_fabric
      KF_DB_PASSWORD: test_password
      EMBEDDING_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Apply DB schema
        run: |
          PGPASSWORD=test_password psql -h localhost -U knowledge_fabric -d knowledge_fabric_test \
            -f db/schema/001_extensions.sql \
            -f db/schema/002_core_tables.sql \
            -f db/schema/003_multi_tenancy.sql

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright src/ || true

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --tb=short --cov=knowledge_fabric --cov-report=term-missing --cov-fail-under=90

      - name: Live Retrieval Smoke Test
        run: uv run python benchmarks/live_retrieval_smoke_test.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          fail_ci_if_error: false
