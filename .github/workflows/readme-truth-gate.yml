name: README Truth Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  truth-gate:
    name: Invariant Truth Gate & Smoke Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify README Claims (TRUTH-01, TRUTH-03, TRUTH-04)
        run: uv run python scripts/verify_readme_claims.py --offline

      - name: Clean Venv Source Install & Smoke Check (TRUTH-02)
        run: |
          uv venv /tmp/smoke-venv
          uv pip --python /tmp/smoke-venv install .
          /tmp/smoke-venv/bin/python -c "import knowledge_fabric; print('knowledge_fabric import ok')"
          /tmp/smoke-venv/bin/knowledge-fabric --help || true
