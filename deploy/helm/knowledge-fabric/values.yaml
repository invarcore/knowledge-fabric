# ==============================================================================
# Knowledge Fabric - Helm Values Configuration
# ==============================================================================

replicaCount: 1

image:
  repository: ghcr.io/invarcore/knowledge-fabric
  pullPolicy: IfNotPresent
  tag: "v0.1.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: fabric.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: fabric-tls
  #    hosts:
  #      - fabric.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ------------------------------------------------------------------------------
# Security, HMAC Signing & Governance Configuration
# ------------------------------------------------------------------------------
security:
  # Enforce cryptographic HMAC-SHA256 signatures on approval step executions
  # Options: "enforce" (recommended for prod) | "permissive" (for dev/staging)
  approvalEnforcement: "enforce"
  strictTenantCheck: true
  strictActionValidation: true
  actionSyntaxRegex: "^[a-zA-Z0-9_.:-]{1,128}$"
  
  signingKey:
    # Set literal key or reference an enterprise secret (HashiCorp Vault, SealedSecret, AWS Secret)
    value: "fabric-prod-signing-key-min-32-characters-required"
    existingSecret: ""
    existingSecretKey: "fabric-signing-key"

# ------------------------------------------------------------------------------
# Model Providers & External API Keys
# ------------------------------------------------------------------------------
ai:
  embeddingProvider: "openai" # "openai" | "ollama" | "cohere" | "mock"
  reranker: "passthrough"     # "passthrough" | "cross_encoder"
  
  openai:
    apiKey: ""
    existingSecret: ""
    existingSecretKey: "openai-api-key"
  
  cohere:
    apiKey: ""
    existingSecret: ""
    existingSecretKey: "cohere-api-key"

# ------------------------------------------------------------------------------
# PostgreSQL & pgvector Configuration
# Supports either embedded StatefulSet (for quickstart/POC) OR external RDS/CloudSQL
# ------------------------------------------------------------------------------
postgresql:
  # Set enabled=true to deploy embedded pgvector StatefulSet
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: "pg16"
    pullPolicy: IfNotPresent
  auth:
    database: "knowledge_fabric"
    username: "knowledge_fabric"
    password: "change-me-in-production"
    existingSecret: ""
    secretPasswordKey: "postgres-password"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # If connecting to external managed PostgreSQL (AWS RDS Aurora, GCP Cloud SQL, Azure PostgreSQL):
  external:
    enabled: false
    host: ""
    port: 5432
    database: "knowledge_fabric"
    username: "knowledge_fabric"
    sslMode: "require"
    existingSecret: ""
    secretPasswordKey: "password"

# ------------------------------------------------------------------------------
# Apache Tika Document Parsing Service
# ------------------------------------------------------------------------------
tika:
  enabled: true
  image:
    repository: apache/tika
    tag: "2.9.2.1"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
