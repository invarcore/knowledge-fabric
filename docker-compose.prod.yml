# ==============================================================================
# Knowledge Fabric - Production / Evaluation Compose
# Uses pre-built images from GitHub Container Registry (GHCR)
# ==============================================================================
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-fabric-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_fabric}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_fabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_fabric} -d ${POSTGRES_DB:-knowledge_fabric}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tika:
    image: apache/tika:2.9.2.1
    container_name: knowledge-fabric-tika
    ports:
      - "127.0.0.1:9998:9998"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9998/tika || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ghcr.io/sagarv48/knowledge-fabric:v0.1.1
    container_name: knowledge-fabric-app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KF_DB_HOST: postgres
      KF_DB_PORT: "5432"
      KF_DB_NAME: ${POSTGRES_DB:-knowledge_fabric}
      KF_DB_USER: ${POSTGRES_USER:-knowledge_fabric}
      KF_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      TIKA_ENDPOINT: "http://tika:9998"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FABRIC_SIGNING_KEY: ${FABRIC_SIGNING_KEY:-enterprise-secret-signing-key-min-32-chars}
      FABRIC_APPROVAL_ENFORCEMENT: ${FABRIC_APPROVAL_ENFORCEMENT:-enforce}
    depends_on:
      postgres:
        condition: service_healthy
      tika:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
