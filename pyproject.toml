[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-fabric"
version = "0.1.1"
description = "MCP-native evidence retrieval platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Knowledge Fabric Contributors" }
]
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0.1",
  "psycopg[binary]>=3.2.0",
  "mcp>=1.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.4.0", "pyright>=1.1.0"]
reranking = ["sentence-transformers>=3.0.0"]

[project.scripts]
knowledge-fabric-mcp = "knowledge_fabric.mcp.server:run_mcp_server"
knowledge-fabric-ingest = "knowledge_fabric.ingestion.cli:main"
knowledge-fabric-sync = "knowledge_fabric.ingestion.sync_cli:main"
knowledge-fabric-ui = "knowledge_fabric.ui.server:main"
knowledge-fabric-eval = "knowledge_fabric.evaluation.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knowledge_fabric.ui" = ["static/*"]
"*" = ["*.sql", "*.yaml", "*.html", "*.svg", "*.css", "*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W292", "W293"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]
"benchmarks/*" = ["E402"]
"examples/*" = ["E402"]


[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

